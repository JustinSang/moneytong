<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  #cover{width:1640px;height:624px;position:relative;overflow:hidden;
    background:linear-gradient(120deg,#0f2f52 0%,#1b5e9c 55%,#3fa7d6 100%);
    font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#fff;}
  /* 은은한 배경 워터마크 ₩ */
  .wm{position:absolute;right:-60px;top:-120px;font-size:640px;font-weight:900;color:rgba(255,255,255,.06);line-height:1;}
  /* 콘텐츠: 세로 중앙, 좌측 여백(프로필 겹침 회피) */
  .content{position:absolute;left:120px;top:50%;transform:translateY(-50%);}
  .brand{display:flex;align-items:center;gap:18px;margin-bottom:22px;}
  .won{font-size:88px;font-weight:900;line-height:1;}
  .name{font-size:76px;font-weight:800;letter-spacing:2px;}
  .slogan{font-size:38px;font-weight:600;opacity:.95;margin-bottom:26px;line-height:1.4;}
  .tags{display:flex;gap:12px;flex-wrap:wrap;max-width:1000px;}
  .tag{background:rgba(255,255,255,.18);padding:11px 22px;border-radius:999px;font-size:26px;font-weight:700;}
  .url{position:absolute;right:70px;bottom:48px;font-size:34px;font-weight:800;opacity:.9;}
</style></head><body>
  <div id="cover">
    <div class="wm">₩</div>
    <div class="content">
      <div class="brand"><span class="won">₩</span><span class="name">머니통</span></div>
      <div class="slogan">정부지원금·환급금·세금계산기까지<br/>5060을 위한 쉽고 빠른 돈 정보</div>
      <div class="tags">
        <span class="tag">취득세</span><span class="tag">재산세</span><span class="tag">자동차세</span>
        <span class="tag">연봉 실수령액</span><span class="tag">기초·국민연금</span><span class="tag">근로장려금</span>
      </div>
    </div>
    <div class="url">moneytong.com</div>
  </div>
</body></html>
